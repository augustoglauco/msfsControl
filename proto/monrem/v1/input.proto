// Monitor Remoto — canal de input e retorno (UDP, AES-128-GCM)
//
// Datagrama: [cabeçalho 12 bytes][payload cifrado][tag GCM 16 bytes]
//   ver_type  u8   (versão << 4) | tipo
//                    1 DATA      cliente → host, payload InputBatch
//                    2 ACK       host → cliente, payload InputAck
//                    3 HELLO     cliente → host, payload UdpHello
//   flags     u8   bit0 KEY_PHASE (troca de chave em andamento)
//   reserved  u16  0
//   pkt_num   u32  contador de transporte POR DIREÇÃO; nunca repete, nem em retransmissão
//   ts_us     u32  32 bits baixos do relógio monotônico de quem envia (wrap a cada ~71 min)
// AAD = cabeçalho inteiro. Nonce = salt(4) ‖ u64 big-endian(pkt_num).
// Chave e salt por direção, derivados do segredo da sessão S (ver control.proto).
// Anti-replay: janela de 64 pacotes por direção.
//
// Confiabilidade (dentro do payload cifrado):
//   - Um InputBatch é CONFIÁVEL se tiver qualquer evento que não seja movimento
//     (DOWN/UP/CANCEL, botão, tecla, texto) ou qualquer Recovery. Recebe reliable_seq > 0.
//   - Descartável: reliable_seq = 0; after_reliable_seq = último confiável enviado.
//     O host descarta o lote se ainda não aplicou after_reliable_seq.
//   - Retransmissão: mesmo conteúdo e reliable_seq, NOVO pkt_num.
//     RTO = max(20 ms, 2 × RTT); até 5 tentativas; depois o host solta todas as
//     teclas e contatos daquele cliente e o cliente reabre a sessão de input.
syntax = "proto3";

package monrem.v1;

option csharp_namespace = "MonRem.Protocol.V1";
option java_package = "dev.monrem.protocol.v1";
option java_multiple_files = true;

message InputBatch {
  uint32 reliable_seq = 1;        // 0 = lote descartável
  uint32 after_reliable_seq = 2;  // ordem relativa aos confiáveis
  repeated InputEvent events = 3;
  repeated Recovery recovery = 4;
}

// Host → cliente.
message InputAck {
  uint32 cumulative_seq = 1;    // todos os reliable_seq <= este foram aplicados
  uint32 sack_bitmap = 2;       // bit i = reliable_seq (cumulative_seq + 1 + i) recebido
}

// Cliente → host, nos DOIS sockets (mídia e input), a cada 1 s.
// Liga o endereço UDP do cliente à sessão e serve de keepalive do caminho.
// O host só troca o endereço de destino se `counter` for maior que o último aceito.
// 3 s sem nenhum UDP do cliente → stream pausado.
message UdpHello {
  string session_id = 1;
  uint64 counter = 2;
}

// Pedidos de recuperação de vídeo (ex-RefInvalidate / REQUEST_IDR), sempre confiáveis.
enum RecoveryKind {
  RECOVERY_KIND_UNSPECIFIED = 0;
  RECOVERY_KIND_REF_INVALIDATE = 1;
  RECOVERY_KIND_REQUEST_IDR = 2;
}

message Recovery {
  uint32 stream_id = 1;
  RecoveryKind kind = 2;
  uint32 first_lost_frame_id = 3;
  uint32 last_ok_frame_id = 4;
}

message InputEvent {
  // Coordenadas sempre normalizadas 0..65535 relativas ao monitor do stream.
  uint32 stream_id = 1;         // 1..254

  oneof event {
    Touch touch = 10;
    Pen pen = 11;
    MouseMove mouse_move = 12;
    MouseButton mouse_button = 13;
    Scroll scroll = 14;
    Key key = 15;
    Text text = 16;
  }
}

enum ContactPhase {
  CONTACT_PHASE_UNSPECIFIED = 0;
  CONTACT_PHASE_DOWN = 1;
  CONTACT_PHASE_MOVE = 2;
  CONTACT_PHASE_UP = 3;
  CONTACT_PHASE_CANCEL = 4;
}

message Contact {
  uint32 pointer_id = 1;        // do cliente; o host remapeia por cliente
  ContactPhase phase = 2;
  uint32 x = 3;
  uint32 y = 4;
  uint32 pressure = 5;          // 0..1024
  uint32 major = 6;             // diâmetro do contato, mesma escala das coordenadas
  uint32 minor = 7;
}

// Sempre o conjunto completo de contatos ativos (o Windows exige isso).
message Touch {
  repeated Contact contacts = 1;
}

message Pen {
  ContactPhase phase = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 pressure = 4;          // 0..1024
  int32 tilt_x = 5;             // graus, -90..90
  int32 tilt_y = 6;
  uint32 buttons = 7;           // bit0 barrel, bit1 eraser
  bool in_range = 8;            // hover
}

message MouseMove {
  oneof position {
    Absolute absolute = 1;
    Relative relative = 2;
  }
  message Absolute {
    uint32 x = 1;
    uint32 y = 2;
  }
  message Relative {
    int32 dx = 1;
    int32 dy = 2;
  }
}

enum MouseButtonId {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
  MOUSE_BUTTON_X1 = 4;
  MOUSE_BUTTON_X2 = 5;
}

message MouseButton {
  MouseButtonId button = 1;
  bool down = 2;
}

// Em unidades de 1/120 de clique (WHEEL_DELTA).
message Scroll {
  int32 dx = 1;
  int32 dy = 2;
}

// Scancode PS/2 set 1, independente do layout do teclado do cliente.
message Key {
  uint32 scancode = 1;
  bool extended = 2;            // prefixo E0
  bool down = 3;
}

message Text {
  string utf8 = 1;
}
